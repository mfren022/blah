name: Sudoku APK

on:
  push:
    paths:
      - 'Sudoku/**'
      - '.github/workflows/sudoku.yml'
  pull_request:
    paths:
      - 'Sudoku/**'
      - '.github/workflows/sudoku.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sudoku
    steps:
      - uses: actions/checkout@v5

      # Robolectric needs Java 21 to run the UI tests against Android 15.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Engine and UI tests
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist-ci
          cp app/build/outputs/apk/release/app-release.apk dist-ci/Sudoku.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs dist-ci/Sudoku.apk
          echo "APK size: $(stat -c %s dist-ci/Sudoku.apk) bytes" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: Sudoku-apk
          path: Sudoku/dist-ci/Sudoku.apk

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Sudoku-screenshots
          path: Sudoku/app/build/screenshots/
          if-no-files-found: ignore
