name: Ottawa Home Price APK

on:
  push:
    paths:
      - 'OttawaHomePrice/**'
      - '.github/workflows/ottawa-home-price.yml'
  pull_request:
    paths:
      - 'OttawaHomePrice/**'
      - '.github/workflows/ottawa-home-price.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OttawaHomePrice
    steps:
      - uses: actions/checkout@v5

      # Robolectric needs Java 21 to run the UI tests against Android 15.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Engine, data and UI tests
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist-ci
          cp app/build/outputs/apk/release/app-release.apk dist-ci/OttawaHomePrice.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs dist-ci/OttawaHomePrice.apk
          echo "APK size: $(stat -c %s dist-ci/OttawaHomePrice.apk) bytes" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: OttawaHomePrice-apk
          path: OttawaHomePrice/dist-ci/OttawaHomePrice.apk

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: OttawaHomePrice-screenshots
          path: OttawaHomePrice/app/build/screenshots/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: OttawaHomePrice-test-reports
          path: |
            OttawaHomePrice/core/build/reports/tests/
            OttawaHomePrice/app/build/reports/tests/
          if-no-files-found: ignore
