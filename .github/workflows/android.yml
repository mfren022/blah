name: Android app

on:
  push:
    paths:
      - "nearby-phone-detector/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "nearby-phone-detector/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nearby-phone-detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nearby-phones-debug-apk
          path: nearby-phone-detector/app/build/outputs/apk/debug/*.apk
